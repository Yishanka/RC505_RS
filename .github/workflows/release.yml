name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-rust-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-${{ github.ref_type }}
          restore-keys: windows-rust-
      - name: Check and test
        shell: pwsh
        run: |
          python scripts/test_release_tools.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "::notice title=Rust toolchain::$(rustc --version)"
          cargo check --all-targets --locked 2>&1 | Tee-Object check.log
          if ($LASTEXITCODE -ne 0) {
            $details = (Get-Content check.log -Tail 24) -join "`n"
            $details = $details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Cargo check failed::$details"
            exit 1
          }
          cargo test --all-targets --locked 2>&1 | Tee-Object test.log
          if ($LASTEXITCODE -ne 0) {
            $details = (Get-Content test.log -Tail 24) -join "`n"
            $details = $details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Cargo tests failed::$details"
            exit 1
          }
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = if ($env:RELEASE_TAG.StartsWith('v')) {$env:RELEASE_TAG.Substring(1)} else {''}
          try { ./scripts/package.ps1 -Version $version 2>&1 | Tee-Object package.log }
          catch {
            $details = (Get-Content package.log -Tail 20) -join "`n"
            $details += "`n" + $_.Exception.Message
            $details = $details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Installer validation failed::$details"
            exit 1
          }
      - name: Publish installer, portable package and update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object FullName)
          python scripts/release_notes.py ($env:RELEASE_TAG.Substring(1)) var/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release create $env:RELEASE_TAG @assets --verify-tag --latest --title "RC505 RS $env:RELEASE_TAG" --notes-file var/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Curate historical release pages
        if: github.repository == 'Yishanka/RC505_RS' && github.ref == 'refs/tags/v0.4.8'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python scripts/curate_releases.py --execute
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save build cache
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-rust-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-${{ github.ref_type }}
