name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-rust-${{ hashFiles('Cargo.lock') }}-${{ github.ref_type }}
          restore-keys: windows-rust-
      - name: Check and test
        shell: pwsh
        run: |
          Write-Output "::notice title=Rust toolchain::$(rustc --version)"
          cargo check --all-targets --locked 2>&1 | Tee-Object check.log
          if ($LASTEXITCODE -ne 0) {
            $details = (Get-Content check.log -Tail 100) -join "`n"
            $details = $details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Cargo check failed::$details"
            exit 1
          }
          cargo test --all-targets --locked 2>&1 | Tee-Object test.log
          if ($LASTEXITCODE -ne 0) {
            $details = (Get-Content test.log -Tail 100) -join "`n"
            $details = $details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Cargo tests failed::$details"
            exit 1
          }
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          ./scripts/package.ps1 -Version $version
      - name: Publish installer, portable package and update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "RC505 RS $env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES_CN.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
